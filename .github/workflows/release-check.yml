name: Release configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release regression tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Validate current manifest and README markers offline
        run: |
          python -c 'import sys,pathlib; sys.path.insert(0,"tools"); import release; d=release.manifest(); release.render_readme(pathlib.Path("README.md").read_text(encoding="utf-8"),dict(d,repository="mchany/comcigan-neo"))'
      - name: Reject stale README synchronization PR
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/readme-release-sync'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py check-readme
