name: Release configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Release regression tests
        run: node --test tools/release.test.cjs tools/recovery.test.cjs
      - name: Export and validate TOML through Gradle
        run: ./gradlew :app:exportReleaseMetadata :app:testReleaseAutomation --no-daemon --console=plain
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        name: Validate release metadata and README markers
        with:
          script: |
            const fs = require('node:fs');
            const release = require('./tools/release.cjs');
            const metadata = JSON.parse(fs.readFileSync('build/release/release.json', 'utf8'));
            release.validateMetadata(metadata);
            release.renderReadme(fs.readFileSync('README.md', 'utf8'), {...metadata, repository: context.repo.owner + '/' + context.repo.repo});
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        name: Reject stale README synchronization PR
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/readme-release-sync'
        with:
          script: |
            const text = require('node:fs').readFileSync('README.md', 'utf8');
            await require('./tools/release.cjs').checkReadme({github, context, core, text});
