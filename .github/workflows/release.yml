name: Release
run-name: Release / ${{ github.event.head_commit.message || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'mchany/comcigan-neo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trigger: ${{ steps.release.outputs.trigger }}
      version: ${{ steps.release.outputs.version }}
      code: ${{ steps.release.outputs.code }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py prepare
  build:
    needs: prepare
    if: needs.prepare.outputs.trigger == 'true'
    environment: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Offline tests and lint (without release keys)
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          ./gradlew :core:model:test :core:comcigan:test :core:neis:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:compileDebugAndroidTestKotlin -PemulatorSmoke=true --no-daemon --console=plain
      - name: Build production unsigned APK and verify embedded key
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          set -euo pipefail
          test -n "$NEIS_API_KEY"
          ./gradlew :app:assembleRelease --no-daemon --no-build-cache --console=plain
          mkdir -p unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned/app-release-unsigned.apk
          python tools/verify_release_apk.py unsigned/app-release-unsigned.apk --version "$VERSION" --code "$CODE" --output unsigned/evidence.json
          python -c 'import json,pathlib,xml.etree.ElementTree as ET; suites=[ET.parse(p).getroot() for p in pathlib.Path(".").glob("**/build/test-results/*/TEST-*.xml")]; assert suites and all(int(s.get("failures",0))==0 and int(s.get("errors",0))==0 for s in suites); count=sum(int(s.get("tests",0))-int(s.get("skipped",0)) for s in suites); p=pathlib.Path("unsigned/evidence.json"); d=json.loads(p.read_text()); d["checks"] += [f"JUnit 보고서 기준 JVM 테스트 {count}개 통과 (NO-SOURCE 태스크 제외)", "Debug·Release Lint 통과", "UI 계측 테스트 소스 컴파일 통과 (기기 실행 미수행)"]; p.write_text(json.dumps(d,ensure_ascii=False),encoding="utf-8")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: unsigned/
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: [prepare, build]
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: unsigned
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Sign in isolation and verify original certificate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keyfile"' EXIT
          test -n "$KEYSTORE" && test -n "$KS_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS"
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "$KEYSTORE" | base64 --decode > "$keyfile"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signed
          "$tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out signed/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs signed/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          "$tools/zipalign" -c -P 16 4 signed/app-release.apk
          export VERIFIED_CERT="$actual"
          python3 -c 'import os,json,pathlib; d=json.loads(pathlib.Path("unsigned/evidence.json").read_text()); d["certificate_sha256"]=os.environ["VERIFIED_CERT"]; d["checks"] += ["기존 배포 인증서 SHA-256 일치 및 APK 서명·정렬 검증"]; pathlib.Path("signed/evidence.json").write_text(json.dumps(d,ensure_ascii=False),encoding="utf-8")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: signed/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, sign]
    environment: release-publishing
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: signed
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: readme-lock
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: comcigan-neo
          permission-contents: write
          permission-pull-requests: write
      - name: Disable previous README auto-merge before publishing
        env:
          GH_TOKEN: ${{ steps.readme-lock.outputs.token }}
        run: python tools/release.py pause-readme
      - name: Generate factual notes and publish verified assets
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python tools/release.py notes --apk signed/app-release.apk --evidence signed/evidence.json --output dist
          python tools/release.py publish --directory dist
  readme:
    needs: [prepare, publish]
    environment: release-readme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: comcigan-neo
          permission-contents: write
          permission-pull-requests: write
      - name: Synchronize README through a reviewed branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python tools/release.py readme
