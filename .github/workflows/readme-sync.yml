name: Finish README sync
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Android, Release configuration, Betterleaks Security Scan]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  finish:
    if: >-
      github.repository == 'mchany/comcigan-neo' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'codex/readme-release-sync' &&
      github.event.workflow_run.head_repository.full_name == 'mchany/comcigan-neo'))
    environment: release-readme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: check
        name: Check latest README and completed CI with read-only token
        with:
          script: |
            const expectedHead = context.eventName === 'workflow_run' ? context.payload.workflow_run.head_sha : null;
            await require('./tools/readme-merge.cjs').checkReadmeMerge({github, context, core, expectedHead});
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        if: steps.check.outputs.ready == 'true'
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: comcigan-neo
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: steps.check.outputs.ready == 'true'
        name: Merge only the validated HEAD without bypassing repository rules
        env:
          README_PR_NUMBER: ${{ steps.check.outputs.pr_number }}
          README_HEAD_SHA: ${{ steps.check.outputs.sha }}
          README_RELEASE_ID: ${{ steps.check.outputs.release_id }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./tools/readme-merge.cjs').mergeReadme({github, context, core,
              number:process.env.README_PR_NUMBER, sha:process.env.README_HEAD_SHA,
              releaseId:process.env.README_RELEASE_ID});
