name: Parser Health

run-name: >-
  Parser Health / ${{ github.event_name == 'pull_request' && 'PR 실행' || inputs.source == 'scheduler' && format('Cloudflare 예약 실행 ({0})', inputs.scheduled_time) || '직접 실행' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'core/comcigan/**'
      - 'core/model/**'
      - '.github/workflows/parser-health.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 실행 출처
        type: choice
        options:
          - manual
          - scheduler
        default: manual
        required: true
      scheduled_time:
        description: Cloudflare 예약 실행 시각
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: parser-health
  cancel-in-progress: false

jobs:
  check-parser:
    name: Live parser check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check live Comcigan parser
        run: |
          ./gradlew :core:comcigan:run \
            --args="중일고등학교" \
            --console=plain
