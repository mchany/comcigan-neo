name: 시간표 조회 오류
description: 학교 검색 또는 시간표 파싱 오류를 제보합니다.
body:
  - type: input
    id: version
    attributes:
      label: 앱 버전 및 Android 버전
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 학교·학급·이번 주 또는 다음 주·발생 시각을 적어 주세요. 개인정보나 전체 원본 응답은 첨부하지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 결과와 실제 결과
