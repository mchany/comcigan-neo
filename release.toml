[release]
version = "1.1.7"
version_code = 24
summary = "컴시간 서비스 페이지의 학교 코드 계산식 변경으로 학교 검색과 두 주 시간표 조회가 실패하는 문제 해결"
changes = [
  "학교 코드 계산식에서 숫자로 직접 쓰인 나눗수와 바로 앞에 선언된 양의 정수 변수를 모두 읽도록 수정",
  "학교 목록을 직접 참조하는 계산식과 목록을 매개변수로 받는 계산식을 지원하고, 두 계산 결과가 일치하면 같은 값으로 처리",
  "주석·문자열·무관한 목록의 계산식을 제외하고, 나눗수를 확정할 수 없거나 계산 결과가 충돌하면 PROTOCOL_CHANGED로 처리",
  "합성 암호화 응답으로 학교 검색과 시간표 파싱을 검증하고, 로컬과 GitHub Actions의 실서버 검사에서 정확한 학교명 검색·빈 검색 결과·두 주 시간표 조회를 모두 확인",
]
