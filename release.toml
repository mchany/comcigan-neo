[release]
version = "1.1.4"
version_code = 21
summary = "컴시간 학교 검색 목록 구조 변경으로 학교 검색과 이번 주·다음 주 시간표 조회가 실패하는 문제 해결"
changes = [
  "학교 검색 목록을 중첩 배열로 직접 읽거나 함수 인수로 전달받는 경우에도 학교 코드 열을 찾도록 수정",
  "학교 코드 열 계산에 필요한 제수와 오프셋을 서비스 페이지에서 읽고, 같은 계산값이 반복되면 하나로 처리",
  "학교 검색과 무관한 계산식을 제외하고, 계산값이 서로 충돌하거나 허용 범위를 벗어나면 프로토콜 오류로 처리",
  "기존 학교 검색 목록 형식과의 호환성을 유지하면서 정확한 학교명 검색, 결과가 없는 검색, 이번 주·다음 주 시간표 조회를 실서버에서 검증",
]
