[release]
version = "1.1.5"
version_code = 22
summary = "컴시간의 요청 방식 변경으로 학교 검색과 이번 주·다음 주 시간표 조회가 실패하는 문제 해결"
changes = [
  "컴시간 서비스 페이지에서 학교 검색과 시간표 요청 방식을 읽고, 새 POST 방식에 맞춰 조회하도록 수정",
  "학교 검색과 시간표 요청에 각각 필요한 본문 인코딩을 적용",
  "기존 GET 방식과 호환되도록 하고, 요청 토큰 갱신과 응답 무결성 검증을 유지",
  "요청 선언이 모호하거나 검색과 시간표의 요청 설정이 일치하지 않으면 프로토콜 오류로 처리",
  "정확한 학교명 검색, 결과가 없는 검색, 이번 주·다음 주 시간표 조회를 실서버에서 검증",
]
