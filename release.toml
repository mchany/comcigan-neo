[release]
version = "1.1.6"
version_code = 23
summary = "컴시간 서비스 페이지의 JavaScript 변경으로 학교 검색과 이번 주·다음 주 시간표 조회가 실패하는 문제 해결"
changes = [
  "시간표 요청 함수에 전달되는 da1의 대입식을 정적으로 분석해 응답 JSON의 갱신 시각 필드를 추출",
  "교시 표시 함수 baSplit의 첫째·둘째 인자를 배열 참조까지 추적해 현재·원본 시간표 필드를 각각 식별",
  "기존 서비스 페이지의 필드 선언을 지원하고, 주석과 문자열은 필드 후보에서 제외",
  "필드가 누락되거나 후보가 충돌하거나 da1에 지원하지 않는 재대입이 있으면 PROTOCOL_CHANGED로 처리",
  "합성 응답으로 갱신 시각·현재 수업·원본 수업·변경 표시를 검증하고, 실서버에서 정확한 학교명 검색·빈 검색 결과·두 주 시간표 조회를 확인",
]
